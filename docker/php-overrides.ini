; SIMKOS PHP overrides untuk FrankenPHP runtime.
; Default upload_max_filesize biasanya 2M — naikkan supaya validasi
; Laravel max:5120 (5MB) tidak ke-blok di layer PHP.
upload_max_filesize = 8M
post_max_size = 16M

; Default memory_limit FrankenPHP biasa cukup, tapi GD bitmap untuk foto
; resolusi tinggi bisa exhaust. Beri ruang aman. ImageOptimizer juga
; override runtime jadi 256M, ini sebagai safety net untuk request lain.
memory_limit = 256M

; Render free tier kasih disk I/O lambat, request bisa berdurasi >30 detik
; saat optimize image + upload ke Supabase. Naikkan timeout.
max_execution_time = 60
max_input_time = 60
