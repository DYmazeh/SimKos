name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Performance + a11y + SEO audit setelah Render deploy.
# Karena Render preview URLs gak deterministic, kita audit production URL.
# Jalankan manual via workflow_dispatch supaya bisa pilih kapan re-audit.

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[lighthouse]')
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://simkos.onrender.com/
            https://simkos.onrender.com/kamar
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: .lighthouserc.json

      - name: Format result comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.lighthouseci/manifest.json';
            if (!fs.existsSync(path)) return;
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            const summary = manifest.map(r => `- **${r.url}** -> [report](${r.url})`).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Lighthouse audit\n${summary}`
            });

  on_dispatch:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "manual dispatch only"

# Trigger:
# 1. Push commit dengan "[lighthouse]" di message
# 2. Atau klik "Run workflow" di GitHub Actions UI (workflow_dispatch)
